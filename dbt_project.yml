name: 'medicare'
version: '0.1.0'
config-version: 2

# Pin to dbt-core 1.10+ — the project depends on schema-yml shapes that were
# deprecated and removed across the 1.7→1.11 line (top-level `freshness:`,
# bare `accepted_values` args, `period: month`). Cap at <2.0 so a future
# major upgrade has to be deliberate.
require-dbt-version: [">=1.10.0", "<2.0.0"]

profile: 'medicare'

# Standard dbt directory layout
model-paths:    ["models"]
seed-paths:     ["seeds"]
test-paths:     ["tests"]
macro-paths:    ["macros"]
snapshot-paths: ["snapshots"]
analysis-paths: ["analyses"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"
  - "logs"

# Materialization defaults — staging as views (cheap), heavy layers as tables.
# Each layer lives in its own schema inside the ANALYTICS database, so the
# warehouse landscape reads cleanly: ANALYTICS.STAGING.*, ANALYTICS.MARTS.*, etc.
models:
  medicare:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: table
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

# Seeds land in the analytics seeds schema
seeds:
  medicare:
    +schema: seeds
    nucc_taxonomy:
      +column_types:
        taxonomy_code:  varchar(10)
        grouping:       varchar(256)
        classification: varchar(256)
        specialization: varchar(256)
        display_name:   varchar(256)
