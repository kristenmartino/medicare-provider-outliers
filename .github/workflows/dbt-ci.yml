name: dbt CI

# Validates the dbt project on every push and PR — runs offline using a
# stub profile so we don't need Snowflake credentials as GitHub secrets.
# Catches model SQL syntax errors, broken refs, undeclared sources, and
# stale schema yml references before they hit the warehouse.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-flight runs when new commits land on a branch.
concurrency:
  group: dbt-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write stub dbt profile
        # The parse step only needs a syntactically valid profile — no real
        # Snowflake connection is attempted. Real builds run locally with the
        # key-pair profile from ~/.dbt/profiles.yml; see docs/auth_setup.md.
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<'EOF'
          medicare:
            target: ci
            outputs:
              ci:
                type: snowflake
                account: ci-stub
                user: ci-stub
                password: ci-stub
                role: ci-stub
                warehouse: ci-stub
                database: ci-stub
                schema: ci-stub
                threads: 1
          EOF

      - name: dbt deps
        run: dbt deps

      - name: dbt parse (full project validation)
        # --no-partial-parse forces dbt to re-validate the entire manifest
        # rather than using a cached one from a previous run.
        run: dbt parse --no-partial-parse

      - name: Show parsed manifest summary
        run: |
          python <<'EOF'
          import json, pathlib
          m = json.loads(pathlib.Path("target/manifest.json").read_text())
          nodes = m.get("nodes", {})
          sources = m.get("sources", {})
          tests = sum(1 for n in nodes.values() if n.get("resource_type") == "test")
          models = sum(1 for n in nodes.values() if n.get("resource_type") == "model")
          seeds = sum(1 for n in nodes.values() if n.get("resource_type") == "seed")
          print(f"Models  : {models}")
          print(f"Seeds   : {seeds}")
          print(f"Tests   : {tests}")
          print(f"Sources : {len(sources)}")
          EOF
