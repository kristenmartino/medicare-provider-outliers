name: dbt CI

# Validates the dbt project on every push and PR using a stub profile so no
# Snowflake credentials need to live in GitHub Secrets. On pushes to main, also
# builds the dbt docs site (without warehouse-derived catalog) and deploys it
# to GitHub Pages.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: dbt-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      docs-built: ${{ steps.docs.outputs.built }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write stub dbt profile
        # The parse step only needs a syntactically valid profile — no real
        # Snowflake connection is attempted. Real builds run locally with the
        # key-pair profile from ~/.dbt/profiles.yml; see docs/auth_setup.md.
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<'EOF'
          medicare:
            target: ci
            outputs:
              ci:
                type: snowflake
                account: ci-stub
                user: ci-stub
                password: ci-stub
                role: ci-stub
                warehouse: ci-stub
                database: ci-stub
                schema: ci-stub
                threads: 1
          EOF

      - name: dbt deps
        run: dbt deps

      - name: dbt parse (full project validation)
        run: dbt parse --no-partial-parse

      - name: Show parsed manifest summary
        run: |
          python <<'EOF'
          import json, pathlib
          m = json.loads(pathlib.Path("target/manifest.json").read_text())
          nodes = m.get("nodes", {})
          sources = m.get("sources", {})
          tests   = sum(1 for n in nodes.values() if n.get("resource_type") == "test")
          models  = sum(1 for n in nodes.values() if n.get("resource_type") == "model")
          seeds   = sum(1 for n in nodes.values() if n.get("resource_type") == "seed")
          print(f"Models  : {models}")
          print(f"Seeds   : {seeds}")
          print(f"Tests   : {tests}")
          print(f"Sources : {len(sources)}")
          EOF

      - name: Build dbt docs (static, empty catalog)
        id: docs
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          dbt docs generate --static --empty-catalog
          # The --static flag emits target/static_index.html containing the
          # whole site in a single file. Stage just that into a clean site/
          # dir for GitHub Pages.
          mkdir -p site
          cp target/static_index.html site/index.html
          echo "built=true" >> "$GITHUB_OUTPUT"

      - name: Upload Pages artifact
        if: steps.docs.outputs.built == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy-docs:
    needs: validate
    if: needs.validate.outputs.docs-built == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
