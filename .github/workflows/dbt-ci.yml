name: dbt CI

# Validates the dbt project on every push and PR using a stub profile so no
# Snowflake credentials need to live in GitHub Secrets. Catches model SQL
# syntax errors, broken refs, undeclared sources, and stale schema yml
# references before they hit the warehouse.
#
# The dbt docs static site is built locally and committed under docs/index.html;
# GitHub Pages serves it from there. See README "dbt docs" section.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Supersede in-flight runs for the same PULL REQUEST only. Keyed by SHA on
# push so a main run is never cancelled — cancelling one means that commit's
# models were never validated, and the cancellation is silent. Cancellation
# also follows workflow START order rather than commit order, so the run that
# survives is not necessarily the one carrying the newest code.
concurrency:
  group: dbt-ci-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write stub dbt profile
        # The parse step only needs a syntactically valid profile — no real
        # Snowflake connection is attempted. Real builds run locally with the
        # key-pair profile from ~/.dbt/profiles.yml; see docs/auth_setup.md.
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<'EOF'
          medicare:
            target: ci
            outputs:
              ci:
                type: snowflake
                account: ci-stub
                user: ci-stub
                password: ci-stub
                role: ci-stub
                warehouse: ci-stub
                database: ci-stub
                schema: ci-stub
                threads: 1
          EOF

      - name: dbt deps
        run: dbt deps

      - name: dbt parse (full project validation)
        run: dbt parse --no-partial-parse

      - name: Show parsed manifest summary
        run: |
          python <<'EOF'
          import json, pathlib
          m = json.loads(pathlib.Path("target/manifest.json").read_text())
          nodes = m.get("nodes", {})
          sources = m.get("sources", {})
          tests   = sum(1 for n in nodes.values() if n.get("resource_type") == "test")
          models  = sum(1 for n in nodes.values() if n.get("resource_type") == "model")
          seeds   = sum(1 for n in nodes.values() if n.get("resource_type") == "seed")
          print(f"Models  : {models}")
          print(f"Seeds   : {seeds}")
          print(f"Tests   : {tests}")
          print(f"Sources : {len(sources)}")
          EOF
