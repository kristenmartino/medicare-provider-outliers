name: Deploy docs to GitHub Pages

# Publishes two things to one GitHub Pages site:
#   /        the pre-built dbt docs static site (committed under docs/)
#   /app     the Evidence data app, built fresh in CI from reports/
#
# dbt docs are generated LOCALLY (`dbt docs generate --static` needs a Snowflake
# connection) and committed under docs/. The Evidence app is BUILT IN CI from
# committed CSV extracts (reports/sources/medicare/*.csv) — no warehouse needed —
# so its ~87 MB of bundled assets (DuckDB-WASM + data) never lands in git.
#
# Why a first-class workflow (not GitHub's managed "deploy from a branch"): that
# legacy builder retries action downloads only once and flaked on a transient
# codeload outage (2026-05-26). This runs on a standard runner with default
# retry behaviour and can be re-run on demand via the Actions tab.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'reports/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: reports/package-lock.json

      - name: Build Evidence app (serves at /app)
        working-directory: reports
        run: |
          npm ci
          npm run sources
          npm run build

      - name: Assemble site — dbt docs at root, Evidence at /app
        run: |
          rm -rf _site && mkdir -p _site
          cp -R docs/. _site/
          rm -rf _site/app && mkdir -p _site/app
          cp -R reports/build/. _site/app/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
